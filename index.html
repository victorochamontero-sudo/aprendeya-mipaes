<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aprendeya MiPAES</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>:root{
  /* Diseño: columna única centrada, cabecera con navegación por nivel; cada nivel tiene su color */
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#0F1B2E; --ink2:#4E5C75; --line:#D9E0EA; --soft:#EAF0F8;
  --brand:#2457D6; --on:#FFFFFF; --good:#13795B; --goodbg:#E3F4EC; --bad:#B3321F; --badbg:#FBEAE6;
  --b:#13795B; --i:#2457D6; --a:#8A2F9C; --e:#B45309; --f:#C2185B;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1422; --surface:#142033; --ink:#E7EDF7; --ink2:#9DAAC2; --line:#26364F; --soft:#1A2A42;
  --brand:#7FA2FF; --on:#0C1422; --good:#4CC9A0; --goodbg:#10302A; --bad:#FF9A86; --badbg:#3A1B17;
  --b:#4CC9A0; --i:#7FA2FF; --a:#D79BE8; --e:#F0A15C; --f:#F27DA8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1422; --surface:#142033; --ink:#E7EDF7; --ink2:#9DAAC2; --line:#26364F; --soft:#1A2A42;
  --brand:#7FA2FF; --on:#0C1422; --good:#4CC9A0; --goodbg:#10302A; --bad:#FF9A86; --badbg:#3A1B17;
  --b:#4CC9A0; --i:#7FA2FF; --a:#D79BE8; --e:#F0A15C; --f:#F27DA8; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:16px 56px}
[data-lv="b"]{--lv:var(--b)} [data-lv="i"]{--lv:var(--i)} [data-lv="a"]{--lv:var(--a)} [data-lv="e"]{--lv:var(--e)} [data-lv="f"]{--lv:var(--f)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.02em}
h2{font-size:clamp(20px,3vw,26px)}
p{margin:0}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.eyebrow,.cefr{font:600 12px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.cefr{color:var(--lv,var(--ink2))}
.lead{font-size:1.1rem;color:var(--ink2);max-width:62ch;margin-top:10px}
.small{font-size:13.5px;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.row.end{justify-content:flex-end;margin-top:22px}.row.center{justify-content:center}

/* cabecera */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.brand{font:800 26px/1 var(--f-display);letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.brand span{color:var(--brand)}
.prog{min-width:200px}
.prog .small{display:block;margin-bottom:4px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--lv,var(--brand));border-radius:99px;transition:width .3s}
.meter.big{height:12px;margin-top:16px}
nav#nav{display:flex;gap:4px;overflow-x:auto;padding:10px 0 2px;margin-bottom:22px;scrollbar-width:thin}
nav#nav a{white-space:nowrap;padding:8px 14px;border-radius:99px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:15px}
nav#nav a:hover{background:var(--soft);color:var(--ink)}
nav#nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* botones */
.btn{font:inherit;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:10px;border:2px solid var(--lv,var(--brand));background:var(--lv,var(--brand));color:var(--on);cursor:pointer;text-decoration:none;line-height:1.2}
.btn.alt{background:transparent;color:var(--lv,var(--brand))}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.say{font:inherit;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.say:hover{border-color:var(--brand);color:var(--brand)}
.say.mini{min-width:40px;padding:6px 10px}.say.mini span{display:none}
.back{display:inline-block;margin-bottom:12px;color:var(--ink2);font-weight:600;text-decoration:none}

/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:center;padding:16px 0 36px}
.hl{color:var(--brand)}
.heroside{background:var(--ink);color:var(--bg);padding:24px;border-radius:14px;display:grid;gap:10px;align-content:start}
.heroside .eyebrow{color:var(--bg);opacity:.7}
.heroside .big{font:700 24px/1.25 var(--f-display)}
.heroside .es{color:var(--bg);opacity:.85}
.heroside .say{background:transparent;color:var(--bg);border-color:currentColor;justify-self:start}
.levels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.levels .lvcard{grid-column:span 2}.levels .lvcard:nth-child(n+4){grid-column:span 3}
@media (max-width:900px){.levels .lvcard,.levels .lvcard:nth-child(n+4){grid-column:span 6}}
.lvcard{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--lv);border-radius:12px;padding:20px;display:grid;gap:10px;align-content:start}
.lvcard .btn{justify-self:start;margin-top:6px}
.how{margin-top:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px}
.how ol{margin:0;padding-left:22px;display:grid;gap:8px;max-width:70ch}

/* nivel */
.lvhead{padding:8px 0 24px;border-left:6px solid var(--lv);padding-left:18px;margin-bottom:20px}
.units{display:grid;gap:10px}
.unit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.unit:hover{border-color:var(--lv)}
.unit .num{font:700 18px var(--f-mono);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--lv)}
.unit .ut{display:grid;gap:2px;min-width:0}.unit .ut span{color:var(--ink2);font-size:14px}
.st{font:600 12px var(--f-mono);padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.st.ok{background:var(--goodbg);color:var(--good)}.st.mid{background:var(--soft);color:var(--lv)}
.examcard{margin-top:24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;background:var(--ink);color:var(--bg);padding:22px;border-radius:12px}
.examcard p{opacity:.85;max-width:56ch;margin-top:6px}
.examcard .small{color:var(--bg)}
.examcard .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}

/* unidad */
.unithead{border-left:6px solid var(--lv);padding-left:18px;margin-bottom:18px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:4px solid transparent;padding:12px 16px;color:var(--ink2);cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lv)}
#unitbody{max-width:760px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px;display:grid;gap:12px}
.lesson p{max-width:66ch}
.exs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.exs li,.vlist li{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:10px;padding:10px 14px}
.en{display:block;font-weight:700}.es{display:block;color:var(--ink2);font-size:14.5px}
.exs li>div{min-width:0}
/* vocabulario */
.cards{display:grid;gap:14px;justify-items:center;margin-bottom:28px}
.card{position:relative;width:min(100%,420px);min-height:190px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:24px;font:inherit}
.card .side{font:700 clamp(26px,6vw,34px)/1.2 var(--f-display);text-align:center}
.card .es{display:none;color:var(--lv);font-size:clamp(22px,5vw,28px);font-weight:700}
.card.flip .en{display:none}.card.flip .es{display:block}
.card.flip{border-color:var(--lv)}
.card.isk{border-style:dashed}
.card .tap{position:absolute;bottom:10px;left:0;right:0;text-align:center;font:600 12px var(--f-mono);color:var(--ink2)}
.vlist h2{margin-bottom:12px}.vlist ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.vlist li.k .en::after{content:" · la sé";font:600 12px var(--f-mono);color:var(--good)}
/* práctica */
.prac{display:grid;gap:16px}
.pbar{display:grid;gap:6px;font-weight:600}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px}
.qt{font-weight:700;font-size:1.1rem;line-height:1.45}
.blank{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--lv,var(--brand));text-align:center;color:transparent}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;min-height:46px;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--lv,var(--brand))}
.opt.sel{border-color:var(--lv,var(--brand));background:var(--soft)}
.opt.good{border-color:var(--good);background:var(--goodbg);color:var(--ink)}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--ink)}
.opt:disabled{cursor:default}
.fillrow input{font:inherit;width:100%;min-height:46px;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.fillrow input.good{border-color:var(--good);background:var(--goodbg)}.fillrow input.bad{border-color:var(--bad);background:var(--badbg)}
.ordans{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:2px dashed var(--line);border-radius:10px}
.ordans.good{border-color:var(--good);background:var(--goodbg)}.ordans.bad{border-color:var(--bad);background:var(--badbg)}
.ordbank{display:flex;flex-wrap:wrap;gap:8px}
.tile{font:inherit;font-weight:600;min-height:42px;padding:8px 14px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tile:hover:not(:disabled){border-color:var(--lv,var(--brand))}
.ordans .tile{background:var(--soft)}
.hint{color:var(--ink2);font-size:14px}
.fb{padding:12px 14px;border-radius:10px;border:2px solid;line-height:1.5}
.fb.good{border-color:var(--good);background:var(--goodbg)}.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb .btn{margin-left:8px}
.result,.examres,.examintro{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:760px}
.examres{max-width:900px}
.score{font:800 clamp(56px,14vw,96px)/1 var(--f-display);color:var(--lv,var(--brand));font-variant-numeric:tabular-nums}
.score.sm{font-size:clamp(40px,10vw,64px)}
.rev{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rev li{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:.95rem}
.rev li.good{border-color:var(--good)}.rev li.bad{border-color:var(--bad)}
.why{color:var(--ink2)}
.examintro ul{margin:0;padding-left:20px;display:grid;gap:6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.paper{display:grid;gap:14px;max-width:760px}
.sticky{position:sticky;top:0;z-index:5;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700}
.eq{border:0;margin:0;padding:0;min-width:0}
.eq legend{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:0 0 6px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
@media (max-width:720px){
 .hero{grid-template-columns:1fr}
 .unit{grid-template-columns:auto minmax(0,1fr)}.unit .st{grid-column:2;justify-self:start}
 .top{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* juegos */
.gh{border-left-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font:inherit;font-weight:600;min-height:40px;padding:6px 16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:10px;align-content:start}
.gcard .btn{justify-self:start}
.gamesband{margin:28px 0 0;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:20px 24px}
.gamesband p{color:var(--ink2);max-width:58ch;margin-top:4px}
.gplay{display:grid;gap:14px;max-width:760px}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc{font:inherit;font-weight:700;min-height:84px;padding:6px;border-radius:10px;border:2px solid var(--line);background:var(--ink);color:var(--bg);cursor:pointer;display:grid;place-items:center;text-align:center;overflow-wrap:anywhere;font-size:15px}
.mc.up{background:var(--surface);color:var(--ink);border-color:var(--brand)}
.mc.ok{background:var(--goodbg);color:var(--ink);border-color:var(--good);cursor:default}
.sprhead{display:flex;justify-content:space-between;font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.word{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.lt{min-width:36px;height:44px;padding:0 6px;display:inline-grid;place-items:center;border-bottom:4px solid var(--ink);font:700 24px var(--f-mono);text-transform:uppercase}
.lt.sp{border-bottom-color:transparent}
.q .word .lt{background:var(--soft);border-radius:8px;border-bottom:0}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font:700 16px var(--f-mono);width:40px;height:44px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-transform:uppercase}
.key.good{background:var(--goodbg);border-color:var(--good)}.key.bad{background:var(--badbg);border-color:var(--bad)}
.key:disabled{cursor:default}
@media (max-width:480px){.mem{grid-template-columns:repeat(3,minmax(0,1fr))}.mc{min-height:76px;font-size:14px}}

/* ===== MiPAES ===== */
:root{--l:#2457D6;--m1:#C2185B;--m2:#8A2F9C;--h:#B45309;--cb:#13795B;--cf:#0B7285;--cq:#6D5BD0;--warn:#B45309;--warnbg:#FDF1E2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--l:#7FA2FF;--m1:#F27DA8;--m2:#D79BE8;--h:#F0A15C;--cb:#4CC9A0;--cf:#5CD3E8;--cq:#B2A6FF;--warn:#F0A15C;--warnbg:#3A2A14}}
[data-lv="l"]{--lv:var(--l)}[data-lv="m1"]{--lv:var(--m1)}[data-lv="m2"]{--lv:var(--m2)}[data-lv="h"]{--lv:var(--h)}[data-lv="cb"]{--lv:var(--cb)}[data-lv="cf"]{--lv:var(--cf)}[data-lv="cq"]{--lv:var(--cq)}
.levels{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.levels .lvcard,.levels .lvcard:nth-child(n+4){grid-column:auto}
.lvcard .ic{font-size:28px;line-height:1}
.lvcard .req{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.hero{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.cd{font:800 clamp(56px,12vw,88px)/1 var(--f-display);color:var(--bg);font-variant-numeric:tabular-nums}
.heroside .small{color:var(--bg);opacity:.8}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:grid;gap:0;min-width:104px}
.stat b{font:800 24px/1.2 var(--f-display);font-variant-numeric:tabular-nums}.stat span{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.mission{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:10px}
.mission ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mission li{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:10px 14px}
.mission li.done{opacity:.6}.mission li.done .mt::before{content:"✓ ";color:var(--good);font-weight:800}
.sec{margin:34px 0 14px}
.pass{border-left:4px solid var(--lv,var(--brand));background:var(--soft);border-radius:0 10px 10px 0;padding:14px 16px;font-size:1rem;line-height:1.65;display:grid;gap:8px}
.pass .src{font:600 12px var(--f-mono);color:var(--ink2)}
.fig{width:min(100%,320px);height:auto;color:var(--ink);justify-self:start}
.dt td,.dt th{padding:7px 10px}
.box{border:2px solid var(--lv,var(--brand));border-radius:10px;padding:12px 14px;background:var(--surface)}
.box b.t{display:block;font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lv,var(--brand));margin-bottom:4px}
.tip{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:10px 14px}
.fm{font-family:var(--f-mono);background:var(--soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.lesson h3{font-size:1.15rem}.lesson ul{margin:0;padding-left:20px;display:grid;gap:4px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font:700 13px var(--f-mono);width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.dot.ans{background:var(--soft);border-color:var(--lv,var(--brand))}.dot.cur{outline:3px solid var(--ink)}
.timer{font:700 18px var(--f-mono);font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.tag{font:600 11px var(--f-mono);padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--lv,var(--ink2));letter-spacing:.05em;text-transform:uppercase}
.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.bar .meter{height:12px}
.big2{font:800 clamp(44px,12vw,72px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.stars{font-size:30px;letter-spacing:4px;color:var(--warn)}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vf .btn{min-height:56px;font-size:17px}

<script>/* ===== utilidades compartidas por datos y app ===== */
var TOPICS=[];
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a}
function fmt(n,d){
 if(d==null)d=Number.isInteger(n)?0:2;
 var neg=n<0;n=Math.abs(n);var s=n.toFixed(d),p=s.split("."),i=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,".");
 if(d>0){var dec=p[1].replace(/0+$/,"");s=dec.length?i+","+dec:i}else s=i;
 return (neg?"−":"")+s;
}
function frac(n,d){var g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d}return d===1?String(n).replace("-","−"):String(n).replace("-","−")+"/"+d}
/* pregunta de alternativas con respuesta correcta y distractores (cadenas) */
function mcq(text,correct,wrongs,why,x){
 var c=String(correct),seen={},ws=[];seen[c]=1;
 wrongs.forEach(function(w){w=String(w);if(!seen[w]){seen[w]=1;ws.push(w)}});
 if(ws.length<3)throw new Error("faltan distractores: "+text);
 var mn=function(t){return String(t).replace(/(^|[\s(=,])-(?=\d)/g,"$1\u2212")};c=mn(c);ws=ws.map(mn);text=mn(text);why=mn(why||"");
 var opts=shuf([c].concat(ws.slice(0,3)));
 var q={text:text,opts:opts,ai:opts.indexOf(c),why:why||""};
 if(x)for(var k in x)q[k]=x[k];
 return q;
}
/* pregunta numérica: respuesta y distractores como números; rellena si faltan */
function numq(text,ans,wrongs,why,o){
 o=o||{};var d=o.d==null?(Number.isInteger(ans)?0:2):o.d,u=o.u||"",seen={},ws=[];
 var key=function(n){return Math.round(n*1e6)};seen[key(ans)]=1;
 wrongs.forEach(function(w){w=Math.round(w*Math.pow(10,d))/Math.pow(10,d);if(isFinite(w)&&!seen[key(w)]&&(o.min==null||w>=o.min)){seen[key(w)]=1;ws.push(w)}});
 var step=Math.max(Math.pow(10,-d),Math.abs(Math.round(ans/8*Math.pow(10,d))/Math.pow(10,d))),t=0;
 while(ws.length<3&&t++<60){var w=ans+(R(0,1)?1:-1)*step*R(1,6);w=Math.round(w*Math.pow(10,d))/Math.pow(10,d);if(isFinite(w)&&!seen[key(w)]&&(o.min==null||w>=o.min)){seen[key(w)]=1;ws.push(w)}}
 var f=function(n){return (o.pre||"")+fmt(n,d)+(u?" "+u:"")};
 return mcq(text,f(ans),ws.map(f),why,o.x);
}
/* figuras SVG simples (usan currentColor, funcionan en claro y oscuro) */
function svgWrap(w,h,inner,alt){return '<svg class="fig" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+(alt||"figura")+'">'+inner+"</svg>"}
function tx(x,y,s,anchor){return '<text x="'+x+'" y="'+y+'" font-size="13" text-anchor="'+(anchor||"middle")+'" fill="currentColor">'+s+"</text>"}
function svgTri(a,b,c,alt){ // triángulo rectángulo: cateto horizontal a, vertical b, hipotenusa c (etiquetas)
 var inner='<polygon points="30,120 190,120 30,20" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="30,104 46,104 46,120" fill="none" stroke="currentColor" stroke-width="1.5"/>'+tx(110,138,a)+tx(14,74,b,"end")+tx(122,62,c,"start");
 return svgWrap(210,146,inner,alt||"triángulo rectángulo");
}
function svgRect(w,h,alt){var inner='<rect x="30" y="20" width="150" height="90" fill="none" stroke="currentColor" stroke-width="2"/>'+tx(105,130,w)+tx(22,70,h,"end");return svgWrap(210,140,inner,alt||"rectángulo")}
function svgCircle(r,alt){var inner='<circle cx="105" cy="70" r="55" fill="none" stroke="currentColor" stroke-width="2"/><line x1="105" y1="70" x2="160" y2="70" stroke="currentColor" stroke-width="2"/><circle cx="105" cy="70" r="2.5" fill="currentColor"/>'+tx(132,64,r);return svgWrap(210,140,inner,alt||"circunferencia")}
function svgGraph(fn,xr,yr,alt,pts){ // gráfico cartesiano de una función
 var W=240,H=200,L=24,B=20,x0=xr[0],x1=xr[1],y0=yr[0],y1=yr[1];
 var X=function(x){return L+(x-x0)/(x1-x0)*(W-L-8)},Y=function(y){return H-B-(y-y0)/(y1-y0)*(H-B-8)};
 var g="";
 for(var i=Math.ceil(x0);i<=x1;i++){g+='<line x1="'+X(i)+'" y1="8" x2="'+X(i)+'" y2="'+(H-B)+'" stroke="currentColor" stroke-opacity=".12"/>';if(i%2===0||x1-x0<=8)g+=tx(X(i),H-6,i)}
 for(var j=Math.ceil(y0);j<=y1;j++){g+='<line x1="'+L+'" y1="'+Y(j)+'" x2="'+(W-8)+'" y2="'+Y(j)+'" stroke="currentColor" stroke-opacity=".12"/>';if(j%2===0||y1-y0<=8)g+=tx(L-4,Y(j)+4,j,"end")}
 var ax=Y(0)>=8&&Y(0)<=H-B?Y(0):H-B,ay=X(0)>=L&&X(0)<=W-8?X(0):L;
 g+='<line x1="'+L+'" y1="'+ax+'" x2="'+(W-8)+'" y2="'+ax+'" stroke="currentColor" stroke-width="1.5"/><line x1="'+ay+'" y1="8" x2="'+ay+'" y2="'+(H-B)+'" stroke="currentColor" stroke-width="1.5"/>';
 var d="",first=true;for(var k=0;k<=120;k++){var x=x0+(x1-x0)*k/120,y=fn(x);if(!isFinite(y)||y<y0-1||y>y1+1){first=true;continue}d+=(first?"M":"L")+X(x).toFixed(1)+" "+Y(y).toFixed(1)+" ";first=false}
 g+='<path d="'+d+'" fill="none" stroke="var(--lv,var(--brand))" stroke-width="3"/>';
 (pts||[]).forEach(function(p){g+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="4" fill="var(--lv,var(--brand))"/>'+(p[2]?tx(X(p[0])+6,Y(p[1])-6,p[2],"start"):"")});
 return svgWrap(W,H,g,alt||"gráfico de una función");
}
function table(head,rows){return '<div class="tw"><table class="dt"><thead><tr>'+head.map(function(h){return "<th>"+h+"</th>"}).join("")+"</tr></thead><tbody>"+rows.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+c+"</td>"}).join("")+"</tr>"}).join("")+"</tbody></table></div>"}

var KEY="mp-prog",MEM=null;
function load(){try{var v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}return MEM||{u:{},ens:[],err:[],days:[],xp:0,dl:{},g:{}}}
var P=load();
["u","dl","g"].forEach(function(k){if(!P[k])P[k]={}});["ens","err","days"].forEach(function(k){if(!P[k])P[k]=[]});if(!P.xp)P.xp=0;

function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function dayKey(off){var d=new Date();d.setDate(d.getDate()-off);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function markDay(what){var t=today();if(P.days.indexOf(t)<0)P.days.push(t);var l=P.dl[t]||(P.dl[t]={p:0,g:0,e:0});if(what)l[what]++;save()}
function streak(){var n=0,o=P.days.indexOf(today())>=0?0:1;while(P.days.indexOf(dayKey(o+n))>=0)n++;return n}
function addXp(n){P.xp+=n;save()}

function noteErr(q){
 var key=strip(q.text)+"|"+q.opts.join("|");
 P.err=P.err.filter(function(e){return e.key!==key});
 P.err.unshift({key:key,text:q.text,opts:q.opts,ai:q.ai,why:q.why||"",pass:q.pass||"",fig:q.fig||"",s:q.s||"",u:q.u||""});
 if(P.err.length>60)P.err.length=60;save();
}

function unitStat(id){return P.u[id]||null}

/* ---------- timers ---------- */
var TM=[];
function every(f,ms){var t=setInterval(f,ms);TM.push(t);return t}
function clearTimers(){TM.forEach(clearInterval);TM=[]}

/* ---------- selección de preguntas ---------- */
function tagq(q,u){q.s=u.s;q.u=u.t;return q}
function genUnit(u){return shuf(u.q()).map(function(q){return tagq(q,u)})}
function sample(subs,n){
 var lists=[];subs.forEach(function(k){unitsOf(k).forEach(function(u){lists.push(genUnit(u))})});lists=shuf(lists);
 var out=[],i=0,guard=0;
 while(out.length<n&&guard++<500){var l=lists[i%lists.length];if(l.length)out.push(l.shift());i++;if(!lists.some(function(x){return x.length}))break}
 return shuf(out);
}

function recUnit(){
 var order=["l","m1","h","cb","m2","cf","cq"],best=null,bs=1e9;
 order.forEach(function(k){unitsOf(k).forEach(function(u){var st=unitStat(u.id),sc=st?st.best:-1;if(sc<85&&sc<bs){bs=sc;best=u}})});
 return best||UNITS[0];
}

 var cards=SUBJ.map(function(s){var us=unitsOf(s.k),dn=us.filter(function(u){var x=unitStat(u.id);return x&&x.best>=70}).length;
  return '<div class="lvcard" data-lv="'+s.k+'"><div class="ic">'+s.ic+'</div><span class="req">'+s.req+'</span><h3>'+s.n+'</h3><p class="small">'+s.d+'</p><div class="meter"><i style="width:'+pct(dn,us.length)+'%"></i></div><span class="small">'+dn+' de '+us.length+' unidades dominadas</span><a class="btn" href="#s-'+s.k+'">Estudiar</a></div>'}).join("");
 set('<section class="hero"><div><div class="eyebrow">Aprendeya MiPAES · 4º medio</div><h1>Prepárate para la PAES <span class="hl">jugando, practicando y avanzando</span></h1><p class="lead">Lecciones cortas, ejercicios con explicación, juegos y ensayos con puntaje estimado para Lectora, Matemática, Historia y Ciencias. Una misión corta por día basta para llegar mejor.</p><div class="row"><a class="btn" href="#s-'+ru.s+'">▶ Seguir con: '+esc(ru.t)+'</a><a class="btn alt" href="#juegos">🎮 Jugar</a></div></div><div class="heroside">'+cdHTML()+'</div></section>'+

 '<div class="gamesband"><div><h2>🎮 Zona de juegos</h2><p>Contrarreloj, cálculo mental, memorice, línea de tiempo y verdadero o falso. Aprender con ganas rinde más.</p></div><a class="btn" href="#juegos">Entrar</a></div>'+
 '<div class="gamesband"><div><h2>🧭 Cómo funciona la PAES</h2><p>Pruebas, tiempos, puntaje y estrategias para rendir con cabeza fría.</p></div><a class="btn alt" href="#paes">Ver guía</a></div>');
}

function ensayoScreen(id){
 var pr=PRUEBAS.filter(function(p){return p.id===id})[0];if(!pr)return homeScreen();

function qHTML(q,i,n,extra){
 var h='<div class="q">'+(q.s?'<div><span class="tag">'+esc(subj(q.s).s)+' · '+esc(q.u||"")+'</span></div>':"");
 if(q.pass)h+='<div class="pass">'+q.pass+'</div>';
 if(q.fig)h+=q.fig;
 h+='<div class="qt">'+q.text+'</div><div class="opts">'+q.opts.map(function(o,j){return '<button class="opt" data-j="'+j+'"><b>'+"ABCD"[j]+".</b> "+o+'</button>'}).join("")+'</div>'+(extra||"")+'</div>';
 return h;
}
function runQuiz(c){
 clearTimers();
 var qs=c.qs,n=qs.length,ans=[],i=0,locked=false,left=c.timeSec||0,ended=false,ex=c.mode==="e";
 for(var z=0;z<n;z++)ans.push(-1);
 function bar(){return '<div class="pbar"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>'+(ex?"":esc(c.title)+" · ")+'Pregunta '+(i+1)+' de '+n+'</span>'+(left?'<span class="timer" id="tmr">'+tm(left)+'</span>':"")+'</div><div class="meter"><i style="width:'+pct(ex?ans.filter(function(a){return a>=0}).length:i,n)+'%"></i></div></div>'}
 function tm(s){var m=Math.floor(s/60),x=s%60;return m+":"+("0"+x).slice(-2)}
 function draw(){
  var q=qs[i],nav="";
  if(ex){nav='<div class="dots">'+qs.map(function(_,j){return '<button class="dot '+(ans[j]>=0?"ans":"")+(j===i?" cur":"")+'" data-go="'+j+'" aria-label="Ir a la pregunta '+(j+1)+'">'+(j+1)+'</button>'}).join("")+'</div><div class="row"><button class="btn alt" id="pv" '+(i?"":"disabled")+'>← Anterior</button>'+(i<n-1?'<button class="btn" id="nx">Siguiente →</button>':'')+'<button class="btn" id="fin" style="margin-left:auto">Terminar ensayo</button></div>'}
  set('<div class="prac">'+bar()+qHTML(q,i,n,'<div id="fb"></div>')+nav+(ex?"":'<div class="row"><a class="back" href="'+c.back+'">Salir</a></div>')+'</div>',c.lv);
  if(ex&&ans[i]>=0)mark(ans[i],false);
  if(!ex&&ans[i]>=0)reveal();
  var tmr=document.getElementById("tmr");
 }
 function mark(j){var bs=$main.querySelectorAll(".opt");bs.forEach(function(b){b.classList.toggle("sel",+b.dataset.j===j)})}
 function reveal(){
  var q=qs[i],bs=$main.querySelectorAll(".opt"),ok=ans[i]===q.ai;
  bs.forEach(function(b){var j=+b.dataset.j;b.disabled=true;if(j===q.ai)b.classList.add("good");else if(j===ans[i])b.classList.add("bad")});
  document.getElementById("fb").innerHTML='<div class="fb '+(ok?"good":"bad")+'"><b>'+(ok?"¡Correcto!":"No es esa. Correcta: "+"ABCD"[q.ai]+".")+'</b> '+(q.why||"")+'<div class="row"><button class="btn small" id="nx">'+(i<n-1?"Siguiente →":"Ver resultado")+'</button></div></div>';
  var b=document.getElementById("nx");if(b)b.focus();
 }
 function finish(){
  if(ended)return;ended=true;clearTimers();
  var ok=0,right=[],byS={};
  qs.forEach(function(q,k){var good=ans[k]===q.ai;if(good){ok++;right.push(q)}else if(!c.reviewMode||ans[k]>=0)noteErr(q);var b=byS[q.s||"x"]||(byS[q.s||"x"]={a:0,n:0});b.n++;if(good)b.a++});
  var r={ok:ok,n:n,right:right},extra=c.after?c.after(r):"",p=pct(ok,n);
  var brk=Object.keys(byS).length>1?'<div class="bars">'+Object.keys(byS).map(function(k){var b=byS[k];return '<div class="bar"><span>'+esc(subj(k).s)+'</span><div class="meter" data-lv="'+k+'"><i style="width:'+pct(b.a,b.n)+'%"></i></div><b>'+b.a+'/'+b.n+'</b></div>'}).join("")+'</div>':"";
  var rev=qs.map(function(q,k){var good=ans[k]===q.ai;
   return '<li class="'+(good?"good":"bad")+'"><b>'+(k+1)+'. '+(good?"✓":"✗")+'</b> '+(q.pass?'<details><summary>Ver texto</summary><div class="pass">'+q.pass+'</div></details>':"")+q.text+(q.fig||"")+'<div class="why">Tu respuesta: '+(ans[k]>=0?"ABCD"[ans[k]]+". "+q.opts[ans[k]]:"en blanco")+' · <b>Correcta: '+"ABCD"[q.ai]+". "+q.opts[q.ai]+'</b></div><div class="why">'+(q.why||"")+'</div></li>'}).join("");
  set('<div class="'+(ex?"examres":"result")+'"><div class="eyebrow">'+esc(c.title)+'</div><h1>'+ok+' de '+n+' correctas</h1><div class="score sm">'+p+'%</div>'+extra+brk+'<div class="row">'+c.btns+'</div><h2 style="margin-top:14px">Respuestas y explicaciones</h2><ul class="rev">'+rev+'</ul></div>',c.lv);
 }
 $main.onclick=function(e){
  if(ended)return;
  var o=e.target.closest(".opt");
  if(o&&!o.disabled){var j=+o.dataset.j;if(ex){ans[i]=j;mark(j);var d=$main.querySelectorAll(".dot");d[i].classList.add("ans");$main.querySelector(".meter i").style.width=pct(ans.filter(function(a){return a>=0}).length,n)+"%"}else{if(locked)return;ans[i]=j;reveal()}return}
  var g=e.target.closest("[data-go]");if(g){i=+g.dataset.go;draw();return}
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="nx"){if(i<n-1){i++;draw()}else finish()}
  else if(b.id==="pv"){i--;draw()}
  else if(b.id==="fin"){var blank=ans.filter(function(a){return a<0}).length;if(!blank||confirm("Te quedan "+blank+" preguntas sin responder. En la PAES no se descuenta por error: ¿terminar igual?"))finish()}
 };
 if(left)every(function(){left--;var t=document.getElementById("tmr");if(t){t.textContent=tm(Math.max(left,0));t.classList.toggle("low",left<=60)}if(left<=0){alert("¡Se acabó el tiempo! Mostraremos tus resultados.");finish()}},1000);
 draw();
}

 function(){var v=[[0,.2],[1,.5],[2,.3]],E=0*.2+1*.5+2*.3;var xs=pick([[[1,.2],[2,.5],[3,.3]],[[0,.1],[1,.6],[4,.3]],[[2,.4],[4,.4],[6,.2]]]);var e=xs.reduce(function(s,p){return s+p[0]*p[1]},0);e=Math.round(e*100)/100;return numq("Una variable X toma los valores "+xs.map(function(p){return p[0]+" (prob. "+fmt(p[1])+")"}).join(", ")+". ¿Cuál es su esperanza E(X)?",e,[xs.reduce(function(s,p){return s+p[0]},0)/xs.length,e+1,e-.5,xs.reduce(function(s,p){return s+p[0]},0)],"E(X) = "+xs.map(function(p){return p[0]+"·"+fmt(p[1])}).join(" + ")+" = "+fmt(e)+".",{d:2})},

/* ===== Competencia Lectora ===== */
function L(t,sum,les,items){
 return U({id:t[0],s:"l",t:t[1],sum:sum,lesson:les,q:function(){
  var out=[];items.forEach(function(it){var ps=it.p?"<p>"+it.p.replace(/\n/g,"</p><p>")+"</p>":"";it.qs.forEach(function(a){out.push(mcq(a[0],a[1],a[2],a[3],ps?{pass:ps}:null))})});return out}})}
var LT_STEPS='<div class="box"><b class="t">Método en 3 pasos</b>1) Lee las preguntas primero. 2) Lee el texto marcando la idea de cada párrafo. 3) Vuelve al texto para verificar: la respuesta correcta siempre se apoya en lo que el texto dice o permite deducir.</div>';

L(["l1","Tema e idea principal"],"Distingue el tema, la idea principal y los detalles de un texto.",[
 {h:"Tema, idea principal y detalles",p:'<ul><li><b>Tema:</b> de qué trata el texto (una frase corta: «el sueño y el aprendizaje»).</li><li><b>Idea principal:</b> lo más importante que se dice sobre el tema (una oración completa).</li><li><b>Detalles:</b> ejemplos, datos y explicaciones que apoyan la idea principal.</li></ul>'+LT_STEPS},
 {h:"Cómo evitar trampas",p:'<ul><li>Las alternativas incorrectas suelen ser <b>muy específicas</b> (un detalle) o <b>demasiado generales</b> (más amplias que el texto).</li><li>Un buen título resume la idea principal sin agregar información nueva.</li></ul><p class="tip">Prueba: ¿la alternativa abarca todo el texto, o solo una parte?</p>'}
],[
 {p:"Dormir no es un lujo, sino una necesidad biológica. Durante el sueño profundo, el cerebro ordena y consolida lo aprendido durante el día: los recuerdos recientes se conectan con los antiguos y se descartan datos irrelevantes. Por eso, un estudiante que se desvela repasando toda la noche suele rendir peor que otro que estudia menos horas, pero duerme bien. Dormir entre siete y nueve horas mejora la atención, el ánimo y la memoria.",qs:[
  ["¿Cuál es la idea principal del texto?","El sueño es indispensable para consolidar el aprendizaje y rendir mejor.",["Los estudiantes deben estudiar de noche para memorizar más.","El cerebro descarta todo lo que aprendimos durante el día.","Dormir siete horas es un lujo que pocos pueden permitirse."],"El texto afirma que dormir es una necesidad y explica cómo ayuda al aprendizaje. Las otras alternativas contradicen o distorsionan el texto."],
  ["¿Cuál es el tema del texto?","La relación entre el sueño y el aprendizaje.",["Las enfermedades del cerebro.","Técnicas de estudio con tarjetas.","La historia del descanso humano."],"El tema es la frase breve que nombra de qué trata: sueño y aprendizaje."],
  ["¿Qué se afirma sobre el estudiante que se desvela repasando?","Suele rendir peor que quien duerme bien.",["Rinde mejor porque estudia más horas.","Recuerda más datos irrelevantes.","Duerme entre siete y nueve horas."],"Es información explícita: «suele rendir peor que otro que estudia menos horas, pero duerme bien»."]]},
 {p:"La municipalidad inauguró 12 kilómetros de ciclovías que conectan los barrios del sector oriente con el centro. Según el alcalde, el objetivo es reducir el uso del auto en trayectos cortos y disminuir la congestión. Los comerciantes valoraron la medida, aunque pidieron más estacionamientos para bicicletas. Un estudio previo mostró que el 30 % de los viajes en la comuna son menores a cinco kilómetros.",qs:[
  ["¿Qué título resume mejor el texto?","Inauguran ciclovías para descongestionar el sector oriente",["Comerciantes rechazan las nuevas ciclovías","El 30 % de los viajes es en bicicleta","Alcalde prohíbe el uso del auto"],"Un buen título recoge la idea central: la apertura de ciclovías y su finalidad."],
  ["¿Para qué sirve el dato del estudio previo?","Para justificar que muchos viajes cortos podrían hacerse en bicicleta.",["Para mostrar que los comerciantes están en contra.","Para criticar al alcalde.","Para indicar cuántos kilómetros de ciclovía faltan."],"Si el 30 % de los viajes son menores a cinco kilómetros, las bicicletas son una alternativa viable: el dato respalda la medida."],
  ["Según el texto, ¿qué pidieron los comerciantes?","Más estacionamientos para bicicletas.",["Menos kilómetros de ciclovías.","Más estacionamientos para autos.","Una nueva consulta al alcalde."],"Está explícito: «pidieron más estacionamientos para bicicletas»."]]}
]);

L(["l2","Información explícita e inferencias"],"Localiza datos del texto y deduce lo que no se dice directamente.",[
 {h:"Explícito vs. implícito",p:'<ul><li><b>Explícita:</b> está escrita; puedes señalarla con el dedo.</li><li><b>Inferencia:</b> es una conclusión razonable a partir de pistas del texto (acciones, palabras, contexto).</li></ul><div class="box"><b class="t">Regla</b>Una inferencia válida debe <b>poder defenderse con el texto</b>. Si necesitas inventar datos, es una trampa.</div>'},
 {h:"Ejemplo",p:'<p>«Se secó la frente y bebió el vaso de un trago.» Inferencia: tenía calor o sed. No sabemos si estaba enfermo ni qué hora era.</p>'}
],[
 {p:"Cuando Marta llegó a la estación, el tren ya se había ido. Miró el reloj, suspiró y se sentó en la banca con la mochila sobre las rodillas. Sacó el celular, pero la pantalla seguía negra. Un hombre con paraguas, que leía el diario a su lado, la miró de reojo: «El próximo pasa en cuarenta minutos», dijo sin levantar la vista. Afuera, la lluvia golpeaba el techo de zinc.",qs:[
  ["¿Cuánto tiempo falta para el próximo tren?","Cuarenta minutos.",["Diez minutos.","Una hora.","No se indica."],"Dato explícito en las palabras del hombre."],
  ["¿Qué se puede inferir de la pantalla negra del celular?","Que el celular estaba apagado o sin batería.",["Que el hombre se lo había quitado.","Que Marta había perdido su pasaje.","Que el tren no pasaría ese día."],"La pantalla «seguía negra»: no respondía. La explicación más razonable es que estaba apagado o sin batería."],
  ["¿Qué estado de ánimo muestra Marta al ver el reloj?","Resignación y contrariedad.",["Entusiasmo.","Enojo violento.","Alegría por llegar temprano."],"Suspira y se sienta: reacción de molestia contenida, no de rabia ni de alegría."]]},
 {p:"El desierto de Atacama es uno de los lugares más áridos del planeta: en algunas zonas pasan años sin registrarse lluvias. Sin embargo, tras episodios excepcionales de precipitaciones, el suelo se cubre de flores en el fenómeno conocido como desierto florido. Las semillas permanecen latentes bajo la superficie, a la espera de la humedad suficiente. Este espectáculo atrae a miles de turistas, lo que exige cuidar el entorno.",qs:[
  ["¿Por qué florece el desierto?","Porque semillas latentes germinan tras lluvias excepcionales.",["Porque llueve todos los inviernos.","Porque los turistas plantan semillas.","Porque la humedad del suelo es constante."],"El texto vincula la floración con precipitaciones excepcionales y semillas latentes."],
  ["¿Cuál es una inferencia válida a partir del texto?","El desierto florido no ocurre todos los años.",["Atacama recibe lluvias abundantes cada invierno.","Las semillas llegan con los turistas.","El fenómeno ocurre sin humedad."],"Si requiere lluvias «excepcionales» y hay años sin lluvia, no es un evento anual."],
  ["¿Qué implica que el turismo «exige cuidar el entorno»?","Que la gran cantidad de visitantes podría dañar el ecosistema.",["Que el turismo está prohibido.","Que las flores son artificiales.","Que el desierto es más húmedo de lo que parece."],"Se sugiere que muchos visitantes representan un riesgo si no se protege el lugar."]]}
]);

L(["l3","Vocabulario en contexto"],"Descubre el significado de palabras según cómo se usan en el texto.",[
 {h:"El contexto manda",p:'<p>Una palabra puede tener varios significados (polisemia). La respuesta correcta es la que <b>mantiene el sentido de la oración completa</b>.</p><ul><li>Reemplaza la palabra por cada alternativa y lee de nuevo.</li><li>Busca pistas: sinónimos cercanos, contrastes («sin embargo»), ejemplos.</li></ul>'},
 {h:"Pistas típicas",p:'<p>«Sus argumentos eran <b>endebles</b>: cualquiera podía refutarlos». La pista (fácil de refutar) revela que endebles = débiles, poco sólidos.</p>'}
],[
 {p:"El director fue tajante: no habría prórrogas para entregar el informe. Los empleados, abatidos, entendieron que debían trabajar el fin de semana. Sin embargo, la jefa de proyecto, con una templanza admirable, organizó turnos y logró terminar a tiempo.",qs:[
  ["En el texto, «tajante» significa:","categórico, sin admitir discusión.",["amable y conciliador.","confuso y ambiguo.","muy ocupado."],"«No habría prórrogas» muestra una decisión firme y definitiva."],
  ["«Abatidos» se puede reemplazar por:","desanimados.",["enojados.","sorprendidos.","entusiasmados."],"Tras la mala noticia, el contexto indica desánimo."],
  ["«Templanza» se refiere a:","serenidad y moderación.",["rapidez para decidir.","enojo contenido.","falta de interés."],"El «Sin embargo» contrasta con el desánimo: ella actúa con calma."]]},
 {p:"El tema es candente: las redes sociales han transformado la manera de informarse. Muchos jóvenes ya no leen la prensa tradicional; se enteran de las noticias a través de videos breves, lo que plantea el desafío de verificar las fuentes.",qs:[
  ["«Candente» significa en el texto:","de gran actualidad e interés.",["muy caliente.","antiguo.","poco importante."],"Se usa en sentido figurado: un tema que genera debate hoy."],
  ["¿Qué palabra puede reemplazar a «transformado» sin cambiar el sentido?","modificado.",["conservado.","olvidado.","detenido."],"Transformar es cambiar una cosa dándole otra forma."],
  ["La expresión «se enteran» equivale a:","toman conocimiento.",["se olvidan.","se entretienen.","se enojan."],"Enterarse es llegar a saber algo."]]}
]);

L(["l4","Propósito, emisor y tipo de texto"],"Identifica para qué se escribió un texto, quién habla y qué función cumple.",[
 {h:"Tipos de texto",p:'<table class="dt"><tbody><tr><td><b>Narrativo</b></td><td>relata hechos con personajes</td></tr><tr><td><b>Expositivo</b></td><td>informa y explica</td></tr><tr><td><b>Argumentativo</b></td><td>defiende una tesis con argumentos</td></tr><tr><td><b>Instructivo</b></td><td>guía pasos para hacer algo</td></tr></tbody></table>'},
 {h:"Funciones del lenguaje",p:'<ul><li><b>Referencial:</b> informar datos.</li><li><b>Apelativa (conativa):</b> influir en el receptor (órdenes, ruegos).</li><li><b>Expresiva (emotiva):</b> expresar sentimientos.</li><li><b>Poética:</b> cuidar la forma del mensaje.</li></ul>'}
],[
 {p:"Para plantar albahaca: llene una maceta con tierra húmeda; coloque tres semillas a medio centímetro de profundidad; cúbralas suavemente y ubique la maceta cerca de una ventana luminosa. Riegue cada dos días, sin empapar.",qs:[
  ["¿Qué tipo de texto es?","Instructivo.",["Narrativo.","Argumentativo.","Lírico."],"Presenta pasos ordenados para lograr un resultado."],
  ["¿Qué función del lenguaje predomina?","Apelativa.",["Expresiva.","Poética.","Metalingüística."],"Se usan verbos en imperativo para dirigir la acción del lector."],
  ["Después de colocar las semillas, ¿qué se debe hacer?","Cubrirlas y poner la maceta cerca de una ventana luminosa.",["Regar abundantemente.","Poner la maceta en la oscuridad.","Cambiar la tierra."],"Es el paso siguiente indicado en el texto."]]},
 {p:"Señor director: Escribo para manifestar mi preocupación por el cierre de la biblioteca del barrio. Durante años fue el único espacio gratuito donde los niños hacían sus tareas. Solicito a las autoridades que reconsideren la decisión y busquen alternativas de financiamiento. Atentamente, Rosa Aguilar.",qs:[
  ["¿Cuál es el propósito principal de la carta?","Persuadir a las autoridades para que reviertan el cierre.",["Informar la historia de la biblioteca.","Entretener a los lectores.","Pedir donaciones de libros."],"La autora busca influir en una decisión: pide que se reconsidere."],
  ["¿Qué función cumple la oración «Durante años fue el único espacio gratuito…»?","Entregar un argumento que justifica su petición.",["Contar una anécdota personal.","Dar una orden a los niños.","Criticar a los vecinos."],"Es una razón que apoya su solicitud."],
  ["¿Qué rol cumple la emisora del texto?","Una vecina que expresa una preocupación comunitaria.",["Una autoridad que informa un cierre.","Una periodista neutral.","Una bibliotecaria despedida."],"Escribe en primera persona como ciudadana interesada."]]}
]);

L(["l5","Textos argumentativos"],"Reconoce tesis, argumentos, contraargumentos, hechos, opiniones y falacias.",[
 {h:"Estructura",p:'<p><b>Tesis</b> (posición) → <b>argumentos</b> (razones, datos, ejemplos, autoridad) → <b>conclusión</b>. Un <b>contraargumento</b> refuta la postura contraria.</p><div class="box"><b class="t">Hecho vs. opinión</b>Hecho: se puede comprobar («abre de lunes a sábado»). Opinión: expresa un juicio («es el mejor lugar»).</div>'},
 {h:"Falacias frecuentes",p:'<ul><li><b>Generalización apresurada:</b> concluir de un solo caso.</li><li><b>Ad populum:</b> «todos lo hacen, entonces es correcto».</li><li><b>Pendiente resbaladiza:</b> «si ocurre A, ocurrirá lo peor».</li><li><b>Falso dilema:</b> presentar solo dos opciones cuando hay más.</li></ul>'}
],[
 {p:"Algunos sostienen que las tareas escolares deberían eliminarse porque agotan a los estudiantes. Sin embargo, la evidencia disponible indica que las tareas breves y bien diseñadas refuerzan lo aprendido en clases y desarrollan hábitos de estudio. El problema no es la tarea en sí, sino su exceso. Por eso, más que suprimirlas, conviene limitarlas y mejorar su calidad.",qs:[
  ["¿Cuál es la tesis del texto?","Las tareas deben limitarse y mejorarse, no eliminarse.",["Las tareas agotan a los estudiantes y deben prohibirse.","Las tareas largas son las más eficaces.","La evidencia sobre las tareas no es confiable."],"La conclusión «más que suprimirlas, conviene limitarlas y mejorar su calidad» expresa la posición del autor."],
  ["¿Qué estrategia argumentativa se usa al inicio con «Algunos sostienen…»?","Presentar la postura contraria para refutarla.",["Citar una opinión para respaldarla.","Narrar una experiencia personal.","Definir un término técnico."],"El autor plantea la idea de otros y luego la rebate con «Sin embargo»."],
  ["¿Qué argumento da el autor a favor de las tareas?","Refuerzan lo aprendido y crean hábitos de estudio.",["Reducen el cansancio.","Reemplazan las clases.","Son obligatorias por ley."],"Aparece explícito: «refuerzan lo aprendido… y desarrollan hábitos de estudio»."]]},
 {p:"(1) La biblioteca abre de lunes a sábado. (2) Es el mejor lugar de la ciudad para estudiar. (3) En 2023 recibió 40 mil visitas. (4) Todo estudiante serio debería visitarla.",qs:[
  ["¿Cuáles de los enunciados son opiniones?","2 y 4.",["1 y 3.","1 y 2.","3 y 4."],"«Mejor lugar» y «debería» expresan juicios; 1 y 3 son comprobables."],
  ["¿Qué enunciado es un hecho verificable con registros?","El 3.",["El 2.","El 4.","Ninguno."],"Las visitas se pueden comprobar con registros de la biblioteca."]]},
 {p:"",qs:[
  ["«Mi vecino aprobó sin estudiar, así que estudiar es innecesario». ¿Qué falacia contiene?","Generalización apresurada.",["Pendiente resbaladiza.","Falso dilema.","Ad hominem."],"Se concluye una regla general a partir de un solo caso."],
  ["«Si permitimos los celulares en clase, pronto nadie prestará atención a nada». Es una falacia de:","pendiente resbaladiza.",["generalización apresurada.","autoridad.","causa común."],"Predice una cadena de consecuencias extremas sin pruebas."]]}
]);

L(["l6","Texto literario y figuras retóricas"],"Reconoce narrador, hablante lírico y figuras literarias.",[
 {h:"Figuras literarias esenciales",p:'<ul><li><b>Metáfora:</b> identifica dos cosas sin «como» («tus ojos son luceros»).</li><li><b>Comparación o símil:</b> usa «como» o «cual».</li><li><b>Personificación:</b> da rasgos humanos a lo no humano.</li><li><b>Hipérbole:</b> exageración.</li><li><b>Ironía:</b> decir lo contrario de lo que se piensa.</li><li><b>Antítesis:</b> contraste de ideas opuestas.</li></ul>'},
 {h:"Narrador y hablante lírico",p:'<ul><li><b>Narrador protagonista:</b> cuenta en 1.ª persona y participa en la historia.</li><li><b>Narrador omnisciente:</b> 3.ª persona, conoce pensamientos de los personajes.</li><li><b>Hablante lírico:</b> la voz que expresa emociones en un poema (no es el poeta).</li></ul>'}
],[
 {p:"La tarde es un cuaderno de cobre,\nel viento pasa las hojas del cerro,\ny yo, como un niño sin tareas,\nle pregunto al río adónde va el tiempo.",qs:[
  ["«La tarde es un cuaderno de cobre» es una:","metáfora.",["comparación.","hipérbole.","ironía."],"Identifica la tarde con un cuaderno sin usar «como»."],
  ["«El viento pasa las hojas del cerro» contiene:","personificación.",["antítesis.","hipérbole.","onomatopeya."],"El viento realiza una acción humana: pasar las hojas como quien lee."],
  ["«Como un niño sin tareas» es una:","comparación.",["metáfora.","ironía.","paradoja."],"Usa el nexo «como» para comparar."],
  ["¿Qué actitud expresa el hablante lírico?","Contemplación serena con reflexión sobre el paso del tiempo.",["Furia contra la naturaleza.","Indiferencia total.","Miedo a la oscuridad."],"Observa el paisaje y pregunta al río por el tiempo: actitud contemplativa."]]},
 {p:"—Qué bien cantas —le dijo Pedro, tapándose los oídos con ambas manos.",qs:[
  ["¿Qué figura se usa en la frase de Pedro?","Ironía.",["Hipérbole.","Metáfora.","Personificación."],"Dice lo contrario de lo que piensa; el gesto de tapar los oídos lo revela."]]},
 {p:"Abrí la puerta y sentí que la casa me miraba. Yo, que había vivido allí veinte años, no reconocía su silencio.",qs:[
  ["¿Qué tipo de narrador presenta el fragmento?","Narrador protagonista.",["Narrador omnisciente.","Narrador testigo.","Hablante lírico."],"Habla en primera persona sobre su propia experiencia."],
  ["«Sentí que la casa me miraba» es una:","personificación.",["hipérbole.","antítesis.","comparación."],"Se atribuye a la casa una acción humana: mirar."]]}

 {h:"Cohesión y coherencia",p:'<p>Los <b>referentes</b> («esta petición», «ellos») retoman ideas ya mencionadas. En una pregunta de «eliminar una oración», saca la que <b>no habla del tema</b> o repite lo anterior.</p>'}
],[
 {p:"",qs:[

  ["¿Qué oración puede eliminarse sin afectar la coherencia?","La 3.",["La 1.","La 2.","La 4."],"La oración 3 no se relaciona con el tema del reciclaje."]]},

/* ===== Historia y Ciencias Sociales ===== */
function S(s,t,sum,les,qs){return U({id:t[0],s:s,t:t[1],sum:sum,lesson:les,q:function(){return qs.map(function(a){var x=a[4]?{pass:"<p>"+a[4]+"</p>"}:null;return mcq(a[0],a[1],a[2],a[3],x)})}})}
function H(t,sum,les,qs){return S("h",t,sum,les,qs)}

CS("cb",["cb2","Genética y herencia"],"Mendel, cuadros de Punnett, mitosis, meiosis y mutaciones.",[
 {h:"Herencia mendeliana",p:'<ul><li><b>Gen:</b> segmento de ADN. <b>Alelo:</b> forma alternativa de un gen.</li><li><b>Dominante (A):</b> se expresa si hay al menos una copia. <b>Recesivo (a):</b> solo si hay dos copias (aa).</li><li><b>Genotipo:</b> los alelos (Aa). <b>Fenotipo:</b> el rasgo visible.</li></ul><div class="box"><b class="t">Cruce Aa × Aa</b>Resultados: 25 % AA, 50 % Aa, 25 % aa → 75 % fenotipo dominante, 25 % recesivo.</div>'},

],[
 ["¿Qué resultado produce la meiosis?","Cuatro células haploides (gametos) genéticamente distintas.",["Dos células idénticas diploides.","Una célula tetraploide.","Dos células con el doble de ADN."],"La meiosis reduce a la mitad el número de cromosomas y genera variabilidad."],

 ["Un individuo Aa tiene el genotipo:","Heterocigoto.",["Homocigoto dominante.","Homocigoto recesivo.","Haploide."],"Tiene dos alelos distintos."],
 ["El fenotipo es:","La manifestación observable de los genes y el ambiente.",["El conjunto de alelos de un individuo.","El número de cromosomas.","La secuencia de ADN."],"El genotipo son los alelos; el fenotipo es lo que se observa."]
],[
 function(){var c=pick([["Aa","Aa",1,4],["Aa","aa",1,2],["AA","Aa",0,1],["aa","aa",1,1],["AA","aa",0,1],["Aa","AA",0,1]]);var p=frac(c[2],c[3]),how={"1/4":"un cuadro de Punnett muestra 1 aa de 4","1/2":"la mitad de los descendientes son aa","0":"ningún descendiente puede ser aa (necesita dos alelos recesivos)","1":"todos los descendientes son aa"}[p];var dis=["0","1/4","1/2","3/4","1"].filter(function(x){return x!==p});return mcq("En una planta, el alelo A (flores moradas) domina sobre a (flores blancas). Si se cruzan "+c[0]+" × "+c[1]+", ¿qué probabilidad hay de que un descendiente tenga flores blancas (aa)?",p,dis,"Al cruzar "+c[0]+" × "+c[1]+", "+how+". Probabilidad = "+p+".")},
 function(){var c=pick([["Aa","Aa","3/4"],["Aa","aa","1/2"],["AA","Aa","1"],["AA","aa","1"]]);var dis=["1/4","1/2","3/4","1","0"].filter(function(x){return x!==c[2]}).slice(0,4);return mcq("Si A es dominante, ¿qué fracción de los hijos de un cruce "+c[0]+" × "+c[1]+" muestra el fenotipo dominante?",c[2],dis,"Se obtiene con el cuadro de Punnett: "+c[2]+" de los descendientes tienen al menos un alelo A.")}
]);

CS("cb",["cb4","Ecología y evolución"],"Cadenas tróficas, flujo de energía, ciclos, selección natural y biodiversidad.",[
 {h:"Flujo de energía",p:'<p>La energía entra por los <b>productores</b> (fotosíntesis), pasa a consumidores primarios, secundarios, etc. En cada nivel trófico solo se transfiere cerca del <b>10 %</b>: el resto se pierde como calor y en procesos vitales. Por eso las cadenas son cortas y hay menos carnívoros que herbívoros.</p><p>La materia, en cambio, se <b>recicla</b> (carbono, nitrógeno, agua) gracias a descomponedores.</p>'},
 {h:"Evolución",p:'<p><b>Selección natural (Darwin):</b> en una población hay variación hereditaria; algunos individuos sobreviven y se reproducen más porque están mejor adaptados; sus rasgos se vuelven más frecuentes con las generaciones.</p>'}
],[
 ["¿Qué nivel trófico corresponde a un conejo que come pasto?","Consumidor primario.",["Productor.","Consumidor secundario.","Descomponedor."],"Se alimenta directamente de un productor (pasto)."],
 ["¿Qué papel cumplen los descomponedores?","Reciclan la materia orgánica en nutrientes.",["Producen energía a partir de la luz.","Son los primeros consumidores.","Evitan el flujo de materia."],"Hongos y bacterias devuelven nutrientes al suelo."],
 ["Según la selección natural:","Los individuos mejor adaptados dejan más descendencia.",["Los organismos cambian a voluntad.","Las características adquiridas se heredan siempre.","Todas las variaciones son perjudiciales."],"Depende de variación hereditaria y reproducción diferencial."],
 ["¿Por qué el efecto invernadero intensificado preocupa?","Porque el exceso de gases como CO₂ retiene más calor y contribuye al cambio climático.",["Porque disminuye el CO₂ de la atmósfera.","Porque enfría el planeta.","Porque aumenta la capa de ozono."],"Las actividades humanas aumentan los gases de efecto invernadero."]
],[
 function(){var e=pick([10000,50000,20000]),n=R(2,3);var v=e*Math.pow(.1,n);return numq("Si los productores almacenan "+fmt(e)+" kJ de energía, ¿cuántos kJ llegan aproximadamente al nivel trófico "+(n+1)+" (regla del 10 %)?",v,[e/2,e*.01*10,v*10,v/10],"En cada transferencia pasa ~10 %: "+fmt(e)+" · 0,1"+sup(n)+" = "+fmt(v)+" kJ.",{u:"kJ"})}

/* ---------- FÍSICA ---------- */
CS("cf",["cf1","Movimiento"],"Rapidez, aceleración, MRU, MRUA y caída libre (g = 10 m/s²).",[
 {h:"Fórmulas esenciales",p:'<ul><li><b>MRU:</b> <span class="fm">d = v·t</span></li><li><b>Aceleración:</b> <span class="fm">a = (v_f − v_i)/t</span></li><li><b>MRUA desde el reposo:</b> <span class="fm">d = ½·a·t²</span> · <span class="fm">v = a·t</span></li><li><b>Caída libre</b> (g = 10 m/s²): <span class="fm">v = 10·t</span> · <span class="fm">h = 5·t²</span></li></ul><p class="tip">Revisa las unidades: pasa km/h a m/s dividiendo por 3,6.</p>'},
 {h:"Interpretar gráficos",p:'<p>En un gráfico <b>posición–tiempo</b>, la pendiente es la rapidez. En un gráfico <b>velocidad–tiempo</b>, la pendiente es la aceleración y el área bajo la curva es la distancia.</p>'}
],[
 ["En un gráfico velocidad–tiempo, una recta horizontal indica:","Velocidad constante (aceleración cero).",["Aceleración constante distinta de cero.","El cuerpo está detenido siempre.","Caída libre."],"Si v no cambia, a = 0."],
 ["Dos cuerpos de distinta masa caen en el vacío desde la misma altura. ¿Cuál llega primero?","Llegan al mismo tiempo.",["El más pesado.","El más liviano.","Depende de su forma en el vacío."],"En el vacío todos aceleran con g, sin importar su masa."]
],[
 function(){var v=R(3,25)*2,t=R(2,9);return numq("Un ciclista avanza a "+v+" m/s constantes durante "+t+" s. ¿Qué distancia recorre?",v*t,[v+t,v/t,v*t*t],"MRU: d = v·t = "+v+" · "+t+" = "+v*t+" m.",{u:"m"})},
 function(){var vi=R(0,5)*2,a=R(2,6),t=R(2,8),vf=vi+a*t;return numq("Un auto pasa de "+vi+" m/s a "+vf+" m/s en "+t+" s. ¿Cuál es su aceleración?",a,[vf/t,(vf+vi)/t,a*t,a+1],"a = (v_f − v_i)/t = ("+vf+" − "+vi+")/"+t+" = "+a+" m/s².",{u:"m/s²"})},
 function(){var a=R(2,6),t=R(2,6);return numq("Un móvil parte del reposo con aceleración "+a+" m/s². ¿Qué distancia recorre en "+t+" s?",a*t*t/2,[a*t,a*t*t,a*t/2,a*t*t/2+t],"d = ½·a·t² = ½ · "+a+" · "+t+"² = "+fmt(a*t*t/2)+" m.",{u:"m"})},
 function(){var t=R(2,6);return numq("Se suelta una piedra desde un edificio. Despreciando el roce y con g = 10 m/s², ¿qué altura cae en "+t+" s?",5*t*t,[10*t,10*t*t,5*t,5*t*t+10],"h = ½·g·t² = 5·"+t+"² = "+5*t*t+" m.",{u:"m"})},
 function(){var k=pick([36,72,108,90]);return numq("Un auto se mueve a "+k+" km/h. ¿Cuál es su rapidez en m/s?",k/3.6,[k*3.6,k/36,k/6,k/3.6+3],"Para pasar de km/h a m/s se divide por 3,6: "+k+"/3,6 = "+fmt(k/3.6)+" m/s.",{u:"m/s"})}
]);

CS("cf",["cf2","Fuerzas, trabajo y energía"],"Leyes de Newton, trabajo, energía cinética y potencial, potencia.",[
 {h:"Leyes de Newton",p:'<ul><li><b>1.ª (inercia):</b> sin fuerza neta, un cuerpo mantiene su velocidad.</li><li><b>2.ª:</b> <span class="fm">F = m·a</span> (N = kg·m/s²).</li><li><b>3.ª:</b> toda acción tiene una reacción igual y opuesta (sobre cuerpos distintos).</li></ul><p>Peso: <span class="fm">P = m·g</span> (g = 10 m/s²).</p>'},
 {h:"Energía",p:'<ul><li>Trabajo: <span class="fm">W = F·d</span> (J).</li><li>Cinética: <span class="fm">Ec = ½·m·v²</span> · Potencial: <span class="fm">Ep = m·g·h</span>.</li><li>Potencia: <span class="fm">P = W/t</span> (W = J/s).</li><li>Sin roce, la energía mecánica total se conserva.</li></ul>'}
],[
 ["Un pasajero se va hacia adelante cuando el bus frena bruscamente. Esto se explica por:","La inercia (1.ª ley de Newton).",["La acción y reacción.","La conservación de la carga.","La fuerza de gravedad solamente."],"El cuerpo tiende a mantener su movimiento."],
 ["¿Cuál es la unidad de fuerza en el SI?","Newton (N).",["Joule (J).","Watt (W).","Pascal (Pa)."],"1 N = 1 kg·m/s²."],
 ["Una pelota sube y su altura aumenta. Si se desprecia el roce, su energía potencial:","Aumenta mientras su energía cinética disminuye.",["Disminuye siempre.","No cambia nunca.","Aumenta junto con la cinética."],"La energía mecánica se conserva: se transforma una en otra."]
],[
 function(){var m=R(2,12),a=R(2,6);return numq("¿Qué fuerza neta se necesita para acelerar una masa de "+m+" kg con "+a+" m/s²?",m*a,[m+a,m/a,m*a*10],"F = m·a = "+m+" · "+a+" = "+m*a+" N.",{u:"N"})},
 function(){var F=R(2,9)*10,d=R(2,9);return numq("Una fuerza de "+F+" N desplaza un objeto "+d+" m en su misma dirección. ¿Cuánto trabajo realiza?",F*d,[F+d,F/d,F*d*10],"W = F·d = "+F+" · "+d+" = "+F*d+" J.",{u:"J"})},
 function(){var m=R(2,10),v=R(2,10);return numq("¿Cuál es la energía cinética de un cuerpo de "+m+" kg que se mueve a "+v+" m/s?",m*v*v/2,[m*v,m*v*v,m*v*v/4],"Ec = ½·m·v² = ½ · "+m+" · "+v+"² = "+fmt(m*v*v/2)+" J.",{u:"J"})},
 function(){var m=R(2,10),h=R(2,12);return numq("¿Cuál es la energía potencial de "+m+" kg a "+h+" m de altura? (g = 10 m/s²)",m*10*h,[m*h,m*10+h,m*h/10],"Ep = m·g·h = "+m+" · 10 · "+h+" = "+m*10*h+" J.",{u:"J"})},
 function(){var W=R(3,9)*100,t=R(2,10);return numq("Una máquina realiza "+W+" J de trabajo en "+t+" s. ¿Qué potencia desarrolla?",W/t,[W*t,W+t,W/t/2],"P = W/t = "+W+"/"+t+" = "+fmt(W/t)+" W.",{u:"W"})}
]);

CS("cf",["cf3","Ondas, sonido y calor"],"Longitud de onda, frecuencia, sonido, luz, calor y temperatura.",[
 {h:"Ondas",p:'<ul><li><span class="fm">v = λ · f</span> (rapidez = longitud de onda × frecuencia). <span class="fm">T = 1/f</span>.</li><li><b>Sonido:</b> onda mecánica longitudinal; necesita un medio (no viaja en el vacío). Mayor frecuencia = tono más agudo; mayor amplitud = más intenso.</li><li><b>Luz:</b> onda electromagnética; viaja en el vacío (≈ 3·10⁸ m/s).</li></ul>'},
 {h:"Calor",p:'<ul><li><b>Calor</b>: energía que fluye del cuerpo más caliente al más frío.</li><li><span class="fm">Q = m·c·ΔT</span> (para agua c = 1 cal/g·°C).</li><li>K = °C + 273.</li></ul>'}
],[
 ["El sonido NO puede propagarse en:","El vacío.",["El aire.","El agua.","Un metal."],"Es una onda mecánica: requiere un medio material."],
 ["Un sonido más agudo tiene mayor:","Frecuencia.",["Amplitud.","Rapidez en el aire.","Longitud de onda."],"El tono depende de la frecuencia."],
 ["Cuando dos cuerpos a distinta temperatura se ponen en contacto, el calor fluye:","Del más caliente al más frío.",["Del más frío al más caliente.","En ambas direcciones a la misma velocidad.","No fluye."],"Hasta alcanzar el equilibrio térmico."]
],[
 function(){var f=R(2,10)*50,l=R(1,6);return numq("Una onda tiene frecuencia "+f+" Hz y longitud de onda "+l+" m. ¿Cuál es su rapidez de propagación?",f*l,[f/l,f+l,l/f],"v = λ·f = "+l+" · "+f+" = "+f*l+" m/s.",{u:"m/s"})},
 function(){var f=pick([2,4,5,10,20,25,50]);return numq("Una onda tiene frecuencia "+f+" Hz. ¿Cuál es su período?",1/f,[f,f/2,2*f,1/(f+1)],"T = 1/f = 1/"+f+" = "+fmt(1/f,3)+" s.",{u:"s",d:3})},
 function(){var m=R(1,5)*100,a=R(10,30),b=a+R(10,30);return numq("¿Cuánto calor se necesita para calentar "+m+" g de agua de "+a+" °C a "+b+" °C? (c = 1 cal/g·°C)",m*(b-a),[m*b,m*(b-a)/10,m+(b-a)],"Q = m·c·ΔT = "+m+" · 1 · "+(b-a)+" = "+m*(b-a)+" cal.",{u:"cal"})},
 function(){var c=pick([0,27,100,-73,127]);return numq("¿A cuántos kelvin equivalen "+c+" °C?",c+273,[c-273,c*273,c+373],"K = °C + 273 = "+(c+273)+" K.",{u:"K"})}
]);

CS("cf",["cf4","Electricidad"],"Corriente, voltaje, resistencia, circuitos y consumo de energía.",[
 {h:"Ley de Ohm y circuitos",p:'<ul><li><span class="fm">V = I · R</span> (V en volt, I en ampere, R en ohm).</li><li><b>Serie:</b> R_total = R₁ + R₂ (misma corriente en todas).</li><li><b>Paralelo:</b> 1/R_t = 1/R₁ + 1/R₂ (mismo voltaje en cada rama); la resistencia total es menor que la menor.</li><li>Potencia: <span class="fm">P = V · I</span>. Energía: <span class="fm">E = P · t</span> (kWh).</li></ul>'}
],[
 ["Cuando se conectan resistencias en serie, la corriente:","Es la misma en todas.",["Se divide entre ellas.","Es cero.","Aumenta en cada una."],"En un único camino la corriente no tiene alternativas."],
 ["Un objeto frotado adquiere carga eléctrica porque:","Se transfieren electrones de un material a otro.",["Se crean protones.","Se destruyen neutrones.","Aumenta su masa atómica."],"Los electrones se transfieren; la carga total se conserva."],
 ["Los materiales que permiten fácilmente el paso de la corriente se llaman:","Conductores.",["Aislantes.","Dieléctricos.","Semiaislantes."],"Metales como el cobre son buenos conductores."]
],[
 function(){var R_=R(2,20),I=R(1,6);return numq("Por una resistencia de "+R_+" Ω circula una corriente de "+I+" A. ¿Cuál es el voltaje?",R_*I,[R_/I,R_+I,R_*I*10],"V = I·R = "+I+" · "+R_+" = "+R_*I+" V.",{u:"V"})},
 function(){var V=pick([12,24,60,120,220]),Rr=pick([2,3,4,6,10,12,20]);if(V%Rr)V=Rr*10;return numq("Una resistencia de "+Rr+" Ω está conectada a "+V+" V. ¿Qué corriente circula?",V/Rr,[V*Rr,V+Rr,Rr/V],"I = V/R = "+V+"/"+Rr+" = "+V/Rr+" A.",{u:"A"})},
 function(){var p=pick([[6,3,2],[12,4,3],[6,6,3],[10,10,5],[20,5,4],[12,6,4]]);return numq("Dos resistencias de "+p[0]+" Ω y "+p[1]+" Ω se conectan en paralelo. ¿Cuál es la resistencia total?",p[2],[p[0]+p[1],p[0]*p[1],(p[0]+p[1])/2],"Paralelo: R = (R₁·R₂)/(R₁+R₂) = "+p[0]*p[1]+"/"+(p[0]+p[1])+" = "+p[2]+" Ω.",{u:"Ω"})},
 function(){var a=R(2,15),b=R(2,15),c=R(2,15);return numq("Tres resistencias de "+a+" Ω, "+b+" Ω y "+c+" Ω están en serie. ¿Cuál es la resistencia total?",a+b+c,[a*b*c,(a+b+c)/3,Math.max(a,b,c)],"En serie se suman: "+a+" + "+b+" + "+c+" = "+(a+b+c)+" Ω.",{u:"Ω"})},
 function(){var P=pick([1,2,0.5,1.5]),h=R(2,8);return numq("Un artefacto de "+fmt(P)+" kW funciona "+h+" horas. ¿Cuántos kWh consume?",P*h,[P+h,h/P,P*h*10],"E = P·t = "+fmt(P)+" · "+h+" = "+fmt(P*h)+" kWh.",{u:"kWh"})}
]);

var ELEM=[["H",1,1],["C",6,12],["N",7,14],["O",8,16],["Na",11,23],["Mg",12,24],["Al",13,27],["Cl",17,35],["K",19,39],["Ca",20,40],["Fe",26,56]];
CS("cq",["cq1","Átomo y tabla periódica"],"Protones, neutrones, electrones, isótopos, iones y periodicidad.",[
 {h:"El átomo",p:'<ul><li><b>Número atómico (Z):</b> protones (identifica el elemento).</li><li><b>Número másico (A):</b> protones + neutrones. Neutrones = A − Z.</li><li>Átomo neutro: electrones = protones. <b>Catión:</b> pierde electrones (+). <b>Anión:</b> gana electrones (−).</li><li><b>Isótopos:</b> mismo Z, distinto A.</li></ul>'},
 {h:"Tabla periódica",p:'<ul><li>Los elementos de un mismo <b>grupo</b> (columna) tienen igual número de electrones de valencia y propiedades parecidas.</li><li>El <b>período</b> (fila) indica el nivel de energía de valencia.</li><li>Hacia la derecha en un período: aumenta la electronegatividad y disminuye el radio atómico. Hacia abajo en un grupo: aumenta el radio.</li></ul>'}
],[
 ["Los elementos de un mismo grupo comparten:","El número de electrones de valencia.",["El número de protones.","La masa atómica.","El número de neutrones."],"Por eso tienen propiedades químicas similares."],
 ["Los isótopos de un elemento tienen:","Igual número de protones y distinto número de neutrones.",["Distinto número de protones.","Igual número de neutrones.","Distinto número de electrones siempre."],"Z es igual, A es distinto."],
 ["¿Qué elemento es más electronegativo?","Flúor (F).",["Sodio (Na).","Potasio (K).","Magnesio (Mg)."],"La electronegatividad aumenta hacia la derecha y hacia arriba; el flúor es el más electronegativo."],
 ["¿Qué tienen los metales alcalinos (grupo 1) en común?","Un electrón de valencia.",["Ocho electrones de valencia.","Dos electrones de valencia.","Ningún electrón de valencia."],"Tienden a perder ese electrón formando cationes +1."]
],[
 function(){var e=pick(ELEM.slice(1)),n=e[2]-e[1];return numq("Un átomo neutro de "+e[0]+" tiene Z = "+e[1]+" y A = "+e[2]+". ¿Cuántos neutrones posee?",n,[e[1],e[2],e[2]+e[1],n+1],"Neutrones = A − Z = "+e[2]+" − "+e[1]+" = "+n+".")},
 function(){var e=pick([["Na",11,1],["Mg",12,2],["Al",13,3],["Ca",20,2],["K",19,1],["Cl",17,-1],["O",8,-2],["N",7,-3]]),q=e[2],el=e[1]-q;return numq("¿Cuántos electrones tiene el ion de "+e[0]+" (Z = "+e[1]+") con carga "+(q>0?"+"+q:"−"+Math.abs(q))+"?",el,[e[1],e[1]+Math.abs(q)+(q>0?0:0),e[1]-q+2,e[1]+q],(q>0?"El catión perdió "+q+" e⁻: ":"El anión ganó "+Math.abs(q)+" e⁻: ")+e[1]+" "+(q>0?"−":"+")+" "+Math.abs(q)+" = "+el+".")}
]);

CS("cq",["cq2","Enlace químico y compuestos"],"Enlace iónico, covalente y metálico, polaridad y propiedades.",[
 {h:"Tipos de enlace",p:'<table class="dt"><thead><tr><th>Enlace</th><th>Entre</th><th>Propiedades</th></tr></thead><tbody><tr><td>Iónico</td><td>metal + no metal (se transfieren e⁻)</td><td>sólidos cristalinos, puntos de fusión altos, conducen en solución</td></tr><tr><td>Covalente</td><td>no metal + no metal (se comparten e⁻)</td><td>moléculas; polares o apolares</td></tr><tr><td>Metálico</td><td>metales</td><td>conductores, maleables, brillo</td></tr></tbody></table>'},

],[
 ["¿Qué tipo de enlace se forma entre Na y Cl?","Iónico.",["Covalente apolar.","Covalente polar.","Metálico."],"El sodio (metal) cede un electrón al cloro (no metal)."],
 ["El enlace entre dos átomos de oxígeno en O₂ es:","Covalente apolar.",["Iónico.","Metálico.","Covalente polar."],"Átomos iguales comparten electrones de forma equitativa."],
 ["¿Cuál es una propiedad típica de los compuestos iónicos?","Alto punto de fusión.",["Son gases a temperatura ambiente.","No conducen la corriente fundidos ni disueltos.","Son blandos y maleables."],"Las fuerzas entre iones son intensas."],
 ["¿Por qué el agua es una molécula polar?","Porque es angular y el oxígeno es más electronegativo que el hidrógeno.",["Porque tiene enlaces iónicos.","Porque es lineal.","Porque no tiene electrones compartidos."],"Los dipolos no se cancelan por la forma angular."],

]);

var MM=[["H₂O",18],["CO₂",44],["NaCl",58.5],["CaCO₃",100],["NH₃",17],["H₂SO₄",98],["NaOH",40],["HCl",36.5],["CH₄",16],["C₆H₁₂O₆",180]];
CS("cq",["cq3","Estequiometría y soluciones"],"Mol, masa molar, concentración molar, balanceo y dilución.",[
 {h:"El mol",p:'<ul><li><b>Masa molar (M):</b> masa de 1 mol (g/mol). Moles: <span class="fm">n = m / M</span>.</li><li>1 mol = 6,02·10²³ partículas.</li><li><b>Ley de conservación de la masa:</b> en una reacción química la masa total no cambia, por eso se <b>balancea</b>: 2 H₂ + O₂ → 2 H₂O.</li></ul>'},
 {h:"Soluciones",p:'<ul><li><b>Molaridad:</b> <span class="fm">M = n (mol) / V (L)</span>.</li><li><b>Dilución:</b> <span class="fm">C₁·V₁ = C₂·V₂</span> (los moles de soluto no cambian).</li></ul>'}
],[
 ["Al balancear una ecuación química se busca que:","Haya igual cantidad de cada tipo de átomo a ambos lados.",["Haya igual número de moléculas a ambos lados.","Los productos tengan más masa.","Se modifiquen los subíndices de las fórmulas."],"Solo se cambian coeficientes, no subíndices."],
 ["¿Cuál es el coeficiente que balancea: __ H₂ + O₂ → __ H₂O?","2 y 2.",["1 y 1.","2 y 1.","1 y 2."],"2 H₂ + O₂ → 2 H₂O: 4 H y 2 O en cada lado."]

/* cálculo mental */
function calcProb(){
 var t=R(0,7),a,b,c;
 switch(t){
  case 0:a=pick([10,20,25,50,5,15,30,40]);b=R(2,20)*10;return{q:a+"% de "+b,a:a*b/100};
  case 1:a=R(23,89);b=R(12,76);return{q:a+" + "+b+" − "+R(5,19),a:null,fix:function(p){return p}};
  case 2:a=R(11,19);b=R(6,15);return{q:a+" × "+b,a:a*b};
  case 3:a=R(2,12);return{q:"√"+a*a+" + "+R(2,5)+"²",a:null};
  case 4:a=R(3,9);b=R(2,5);return{q:a+"<sup>"+b+"</sup> ",a:Math.pow(a,b)};
  case 5:a=R(3,12);b=R(2,9);c=R(10,60);return{q:"Si "+a+"x + "+b+" = "+(a*c+b)+", ¿x?",a:c};
  case 6:a=R(2,9);b=R(2,9);c=R(2,9);return{q:"−"+a+" + "+b+" − "+c+" + "+R(1,9),a:null};
  default:a=pick([2,4,5,8,10]);b=R(2,9)*a;return{q:"1/"+a+" de "+b*1+"  ",a:b/a};
 }
}
function calcScreen(){
 function intro(){set('<a class="back" href="#juegos">← Juegos</a><div class="gplay"><h1>🧮 Cálculo mental</h1><p class="lead">Resuelve 12 operaciones en 90 segundos, sin calculadora. Escribe el resultado y presiona Enter. Para decimales usa coma o punto.</p><div class="row"><button class="btn" id="go">¡Empezar!</button></div></div>');$main.onclick=function(e){if(e.target.id==="go")play()}}
 function mk(){var p=calcProb();
  if(p.a===null){ // problemas con valor computado de forma segura
   var m=p.q.match(/^(\d+) \+ (\d+) − (\d+)$/);
   if(m)p.a=+m[1]+ +m[2]-m[3];
   else if(m=p.q.match(/^√(\d+) \+ (\d)²$/))p.a=Math.sqrt(+m[1])+ +m[2]*m[2];
   else if(m=p.q.match(/^−(\d) \+ (\d) − (\d) \+ (\d)$/))p.a=-m[1]- -m[2]-m[3]- -m[4];
  }
  return p}
 function play(){

    inp.classList.add(good?"good":"bad");document.getElementById("fb").innerHTML='<div class="fb '+(good?"good":"bad")+'">'+(good?"¡Bien!":"Era "+fmt(cur.a))+'</div>';
    setTimeout(function(){if(n>=12){clearTimers();gameEnd("calc",ok,ok*6+(ok===12?20:0),"","juego-calc")}else{cur=mk();busy=false;draw()}},good?400:1100)}
   inp.onkeydown=function(e){if(e.key==="Enter")submit()};document.getElementById("ok").onclick=submit}
  clearTimers();every(function(){left--;var t=document.getElementById("tt");if(t){t.textContent=Math.max(left,0);t.classList.toggle("low",left<=10)}if(left<=0){clearTimers();gameEnd("calc",ok,ok*6,"<p class=\"small\">Se acabó el tiempo: respondiste "+n+" operaciones.</p>","juego-calc")}},1000);

function vfScreen(){
 var qs=shuf(VF).slice(0,10),i=0,sc=0;
 function draw(){var q=qs[i];set('<a class="back" href="#juegos">← Juegos</a><div class="gplay"><div class="sprhead"><span>'+(i+1)+' / 10</span><span>✓ '+sc+'</span></div><div class="q"><div><span class="tag">'+q[3]+'</span></div><div class="qt" style="font-size:1.25rem">'+q[0]+'</div><div class="vf"><button class="btn" data-v="1">Verdadero</button><button class="btn alt" data-v="0">Falso</button></div><div id="fb"></div></div></div>');
  $main.onclick=function(e){var b=e.target.closest("[data-v]");if(b){var good=(+b.dataset.v===1)===q[1];if(good)sc++;
   $main.querySelectorAll("[data-v]").forEach(function(x){x.disabled=true});
   document.getElementById("fb").innerHTML='<div class="fb '+(good?"good":"bad")+'"><b>'+(good?"¡Correcto!":"Ups.")+'</b> '+(q[1]?"Es verdadero. ":"Es falso. ")+q[2]+'<div class="row"><button class="btn small" id="nx">'+(i<9?"Siguiente →":"Ver resultado")+'</button></div></div>';document.getElementById("nx").focus()}
   else if(e.target.id==="nx"){if(i<9){i++;draw()}else gameEnd("vf",sc,sc*5+5,"","juego-vf")}}}
 draw();
}

/* ===== router ===== */
function navHTML(cur){
 var L=[["inicio","Inicio"]].concat(SUBJ.map(function(s){return["s-"+s.k,s.s]})).concat([["juegos","Juegos"],["errores","Errores"+(P.err.length?" ("+P.err.length+")":"")],["paes","Guía PAES"]]);
 return L.map(function(l){return '<a href="#'+l[0]+'"'+(cur===l[0]||(cur.charAt(0)==="u"&&cur.indexOf("-")>0&&uById(cur.slice(2))&&"s-"+uById(cur.slice(2)).s===l[0])?' aria-current="page"':"")+'>'+l[1]+'</a>'}).join("");
}
function route(){
 clearTimers();$main.onclick=null;
 var h=(location.hash||"#inicio").slice(1),m;
 $nav.innerHTML=navHTML(h);
 var hp=document.getElementById("hprog");if(hp)hp.innerHTML='<span class="small">🔥 '+streak()+' · ⭐ '+P.xp+' XP · '+rank().n+'</span>';
 if(h==="inicio")homeScreen();
 else if(m=h.match(/^s-(\w+)$/))subjScreen(m[1]);
 else if(m=h.match(/^u-(\w+)$/))unitScreen(m[1]);
 else if(m=h.match(/^p-(\w+)$/))practiceScreen(m[1]);
 else if(m=h.match(/^ens-(\w+)$/))ensayoScreen(m[1]);
 else if(h==="juegos")gamesScreen();
 else if(h==="juego-reloj")relojScreen();
 else if(h==="juego-calc")calcScreen();
 else if(h==="juego-memo")memoScreen();
 else if(h==="juego-linea")lineaScreen();
 else if(h==="juego-vf")vfScreen();
 else if(h==="errores")errScreen();
 else if(h==="paes")paesScreen();
 else homeScreen();
 markDayView();
}
function markDayView(){}
window.addEventListener("hashchange",route);
route();
/* si el enlace apunta a la pantalla actual (otra ronda, jugar otra vez), hashchange no se dispara: forzar */
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest('a[href^="#"]');if(a&&a.getAttribute("href")===location.hash){e.preventDefault();route()}});
</script>
